  <g id="text_41">
   <text style="fill: #006fee; font: 700 11px 'Arial'; text-anchor: start" x="63.36" y="37.584" transform="rotate(-0 63.36 37.584)">EDA → ОБЪЯСНИМЫЙ МЕТОД</text>
  </g>
  <g id="text_42">
   <text style="fill: #18181b; font: 700 29px 'Arial'; text-anchor: start" x="63.36" y="82.944" transform="rotate(-0 63.36 82.944)">От связей в данных — к объяснению рекомендации.</text>
  </g>
  <g id="text_43">
   <text style="fill: #71717a; font: 13px 'Arial'; text-anchor: start" x="63.36" y="116.64" transform="rotate(-0 63.36 116.64)">Слева — статистика всех окон; справа — локальное объяснение одного реального кандидата</text>
  </g>
  <g id="text_44">
   <text style="fill: #71717a; font: 11px 'Arial'; text-anchor: end" x="1088.64" y="37.584" transform="rotate(-0 1088.64 37.584)">03 / 08</text>
  </g>
  <g id="text_45">
   <text style="fill: #18181b; font: 700 15px 'Arial'; text-anchor: start" x="812.16" y="184.68" transform="rotate(-0 812.16 184.68)">Пример Exact SHAP</text>
  </g>
  <g id="text_46">
   <text style="fill: #71717a; font: 11px 'Arial'; text-anchor: start" x="812.16" y="213.84" transform="rotate(-0 812.16 213.84)">Jezero → кандидат №01</text>
  </g>
  <g id="text_47">
   <!-- Вклад в балл $\times10^{-3}$ -->
   <g style="fill: #71717a" transform="translate(812.16 234.576)">
    <text>
     <tspan style="font: 10px 'Arial'" x="0 6.669922 11.044922 16.879883 22.441406 28.276367 31.054688 36.367188 39.145508 44.873047 50.43457 56.269531 62.104492" y="-0.9765625">Вклад в балл </tspan>
     <tspan style="font: 10px 'DejaVu Sans'" x="64.882812 73.261719 79.624023" y="-0.9765625">×10</tspan>
     <tspan style="font: 7px 'DejaVu Sans'" x="86.082031 91.947266" y="-4.8046875">−3</tspan>
    </text>
   </g>
  </g>
  <g id="text_48">
   <text style="fill: #71717a; font: 11px 'Arial'" transform="translate(817.92 462.146719)">Синий: уменьшает несовпадение</text>
   <text style="fill: #71717a; font: 11px 'Arial'" transform="translate(817.92 476.28)">Красный: увеличивает</text>
  </g>
  <g id="text_49">
   <text style="fill: #18181b; font: 500 15px 'Arial'; text-anchor: start" x="63.36" y="581.904" transform="rotate(-0 63.36 581.904)">SHAP показывает вклад каждого критерия в конкретную рекомендацию.</text>
  </g>
  <g id="text_50">
   <text style="fill: #71717a; font: 9.5px 'Arial'" transform="translate(63.36 608.484703)">Корреляции: полный production-атлас. SHAP: четыре слагаемых действующего score; фон — среднее десяти рекомендаций.</text>
   <text style="fill: #71717a; font: 9.5px 'Arial'" transform="translate(63.36 618.84)">Корреляция описывает данные, SHAP объясняет вычисленный балл. Это разные задачи; ни одна диаграмма не доказывает причинность.</text>
  </g>
 </g>
