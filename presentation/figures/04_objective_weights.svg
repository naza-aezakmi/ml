  <g id="text_34">
   <text style="fill: #71717a; font: 12px 'Arial'; text-anchor: start" x="311.04" y="518.4" transform="rotate(-0 311.04 518.4)">Нормировки различий: профиль 100 м  ·  перепад 150 м  ·  наклон 2°  ·  неровность 50 м</text>
  </g>
  <g id="text_35">
   <text style="fill: #18181b; font: 500 15px 'Arial'; text-anchor: start" x="63.36" y="581.904" transform="rotate(-0 63.36 581.904)">Ранжируем кандидатов под задачу пользователя.</text>
  </g>
  <g id="text_36">
   <text style="fill: #71717a; font: 9.5px 'Arial'" transform="translate(63.36 608.484703)">Действующий поиск: взвешенная сумма квадратов нормированных различий. Меньший балл — ближе рельеф.</text>
   <text style="fill: #71717a; font: 9.5px 'Arial'" transform="translate(63.36 618.84)">Веса и нормировки заданы разработчиками; они не являются обученными вероятностями или пределами безопасности.</text>
