  <g id="text_28">
   <text style="fill: #006fee; font: 700 11px 'Arial'; text-anchor: start" x="63.36" y="37.584" transform="rotate(-0 63.36 37.584)">МЕТОД / РЕЗУЛЬТАТ</text>
  </g>
  <g id="text_29">
   <text style="fill: #18181b; font: 700 29px 'Arial'; text-anchor: start" x="63.36" y="82.944" transform="rotate(-0 63.36 82.944)">Десять земных кандидатов для выбранной задачи.</text>
  </g>
  <g id="text_30">
   <text style="fill: #71717a; font: 13px 'Arial'; text-anchor: start" x="63.36" y="116.64" transform="rotate(-0 63.36 116.64)">Jezero · испытания ровера · балл несовпадения D: меньше — лучше</text>
  </g>
  <g id="text_31">
   <text style="fill: #71717a; font: 11px 'Arial'; text-anchor: end" x="1088.64" y="37.584" transform="rotate(-0 1088.64 37.584)">06 / 08</text>
  </g>
  <g id="text_32">
   <text style="fill: #18181b; font: 500 15px 'Arial'; text-anchor: start" x="63.36" y="581.904" transform="rotate(-0 63.36 581.904)">Пользователь сравнивает альтернативы и открывает объяснение выбранного места.</text>
  </g>
  <g id="text_33">
   <text style="fill: #71717a; font: 9.5px 'Arial'" transform="translate(63.36 608.484703)">Реальный ответ API. Список учитывает географическое правило: до трёх мест США при достаточном числе кандидатов.</text>
   <text style="fill: #71717a; font: 9.5px 'Arial'" transform="translate(63.36 618.84)">Баллы не являются процентами сходства. Синий — кандидат, подробно показанный на соседних слайдах.</text>
  </g>
